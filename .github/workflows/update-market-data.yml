name: Atualizar dados do MXRF11
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 09:00 em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_market_data.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Atualiza dados do MXRF11" && git push)
